<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <button id="restart-btn">Reiniciar</button>
        <button id="home-btn" class="secondary-btn hidden">Inicio</button>
      </div>
    </div>
  </div>

  <div id="start-screen" class="start-screen">
    <div class="start-box">
      <h1 class="start-title">TETRIS</h1>

      <div class="start-section">
        <span class="label">RECORDS</span>
        <div id="score-table"></div>
      </div>

      <div class="start-stats">
        <div class="stat">
          <span class="label">MEJOR COMBO</span>
          <span class="stat-value" id="best-combo">0</span>
        </div>
        <div class="stat">
          <span class="label">LÍNEAS MÁXIMAS</span>
          <span class="stat-value" id="max-lines">0</span>
        </div>
      </div>

      <div class="start-actions">
        <button id="play-btn">Jugar</button>
        <button id="reset-records-btn" class="secondary-btn">Resetear records</button>
        <button id="cancel-reset-btn" class="secondary-btn hidden">Cancelar</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
